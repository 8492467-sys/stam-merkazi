<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קטגוריה — אתר הסת"ם המרכזי</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="categories.js"></script>
<script src="auth.js"></script>
</head>
<body class="has-tabbar">
<a href="#main" class="skip-link">דלג לתוכן העיקרי</a>

<div class="top-bar">
  ✡️ ברוכים הבאים לאתר הסת"ם המרכזי <span class="sep">•</span> פרסום מודעה בחינם <span class="sep">•</span> לוח אחד לכל עולם הסת"ם
</div>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="logo">
      <span class="logo-icon">🏛️</span>
      <span class="logo-text">אתר הסת"ם המרכזי</span>
    </a>
    <nav class="main-nav" aria-label="ניווט ראשי">
      <a href="index.html">דף הבית</a>
      <a href="forum-page.html" class="btn-forum">💬 פורום</a>
    </nav>
  </div>
</header>

<main id="main">
  <div class="container">
    <p class="breadcrumb">
      <a href="index.html">דף הבית</a>
      <span class="sep">›</span>
      <span id="breadcrumbCat"></span>
    </p>

    <div class="cat-hero" id="catHero">
      <div class="cat-hero-info">
        <div class="cat-hero-icon" id="catHeroIcon"></div>
        <div>
          <h1 class="cat-hero-title" id="catTitle">קטגוריה</h1>
          <p class="cat-hero-sub" id="catDesc"></p>
        </div>
      </div>
      <div class="cat-hero-search">
        <input type="search" id="searchInput" placeholder="חיפוש...">
        <span class="icon">🔍</span>
      </div>
    </div>

    <div class="filter-bar" id="filterBar"></div>

    <div id="listingsArea">
      <div class="loading">טוען מודעות...</div>
    </div>
  </div>
</main>

<!-- סרגל מעבר בין כל הקטגוריות -->
<nav class="cat-tabbar" aria-label="מעבר בין קטגוריות">
  <div class="cat-tabbar-inner" id="catTabbar" role="tablist"></div>
</nav>

<script>
const params = new URLSearchParams(location.search);
const cat = params.get('cat');
let searchText = '';
const activeFilters = {};

buildCatTabbar();

if (!cat || !ALL_CATS.includes(cat)) {
  document.getElementById('catHero').style.display = 'none';
  document.getElementById('catTitle').textContent = 'קטגוריה לא נמצאה';
  document.getElementById('listingsArea').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>הקטגוריה המבוקשת לא נמצאה. <a href="index.html">חזרה לדף הבית</a></p></div>';
} else {
  const colors = CAT_COLOR[cat];
  document.getElementById('catHero').style.background = `linear-gradient(135deg, var(--black) 0%, ${colors.color} 100%)`;
  document.getElementById('catHeroIcon').textContent = CAT_ICON[cat];
  document.getElementById('catTitle').textContent = CAT_HE[cat];
  document.getElementById('catDesc').textContent = CAT_DESC[cat];
  document.getElementById('breadcrumbCat').textContent = CAT_HE[cat];
  document.title = CAT_HE[cat] + ' — אתר הסת"ם המרכזי';
  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchText = e.target.value.trim().toLowerCase();
    loadListings();
  });
  buildFilterBar();
  loadListings();
}

// סרגל מעבר בין כל הקטגוריות
function buildCatTabbar() {
  const bar = document.getElementById('catTabbar');
  ALL_CATS.forEach(c => {
    const tab = document.createElement('a');
    tab.className = 'cat-tab' + (c === cat ? ' active' : '');
    tab.href = 'categories-all.html?cat=' + c;
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', c === cat ? 'true' : 'false');
    tab.innerHTML = `<span class="tab-icon">${CAT_ICON[c]}</span><span class="tab-label">${CAT_HE[c]}</span>`;
    bar.appendChild(tab);
  });
  const activeTab = bar.querySelector('.cat-tab.active');
  if (activeTab) {
    requestAnimationFrame(() => activeTab.scrollIntoView({ behavior: 'instant', block: 'nearest', inline: 'center' }));
  }
}

function buildFilterBar() {
  const bar = document.getElementById('filterBar');
  const fields = (CATEGORY_FIELDS[cat] || []).filter(f => f.type === 'select');
  if (!fields.length) { bar.style.display = 'none'; return; }

  fields.forEach(field => {
    const wrap = document.createElement('div');
    wrap.className = 'filter-field';
    const label = document.createElement('label');
    label.textContent = field.label;
    label.setAttribute('for', 'filter-' + field.key);
    const select = document.createElement('select');
    select.id = 'filter-' + field.key;
    select.innerHTML = '<option value="">הכל</option>' + field.options.map(o => `<option value="${o}">${o}</option>`).join('');
    select.addEventListener('change', () => {
      if (select.value) activeFilters[field.key] = select.value;
      else delete activeFilters[field.key];
      loadListings();
    });
    wrap.appendChild(label);
    wrap.appendChild(select);
    bar.appendChild(wrap);
  });

  const resetBtn = document.createElement('button');
  resetBtn.type = 'button';
  resetBtn.className = 'btn btn-outline btn-reset';
  resetBtn.textContent = 'איפוס סינון';
  resetBtn.addEventListener('click', () => {
    Object.keys(activeFilters).forEach(k => delete activeFilters[k]);
    bar.querySelectorAll('select').forEach(s => s.value = '');
    loadListings();
  });
  bar.appendChild(resetBtn);
}

async function loadListings() {
  const area = document.getElementById('listingsArea');
  area.innerHTML = '<div class="loading">טוען מודעות...</div>';

  let query = supabase
    .from('listings')
    .select('id, title, description, details, created_at, listing_images(storage_path, display_order)')
    .eq('category', cat)
    .eq('status', 'active')
    .order('created_at', { ascending: false });

  Object.entries(activeFilters).forEach(([key, value]) => {
    query = query.filter('details->>' + key, 'eq', value);
  });

  let { data, error } = await query;

  if (error) {
    area.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>שגיאה בטעינת המודעות.</p></div>';
    console.error(error);
    return;
  }

  if (searchText) {
    data = (data || []).filter(item =>
      (item.title || '').toLowerCase().includes(searchText) ||
      (item.description || '').toLowerCase().includes(searchText)
    );
  }

  if (!data || !data.length) {
    area.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>אין עדיין מודעות בקטגוריה זו' + (Object.keys(activeFilters).length || searchText ? ' לפי הסינון שנבחר' : '') + '.</p></div>';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'listing-grid';

  data.forEach(item => {
    const images = (item.listing_images || []).slice().sort((a,b) => a.display_order - b.display_order);
    const firstImg = images[0];
    const imgUrl = firstImg ? supabase.storage.from('listing-images').getPublicUrl(firstImg.storage_path).data.publicUrl : null;

    const card = document.createElement('a');
    card.className = 'listing-card';
    card.href = 'listing.html?id=' + item.id;

    const fields = CATEGORY_FIELDS[cat] || [];
    const tags = fields
      .filter(f => f.key !== 'price' && item.details && item.details[f.key])
      .slice(0, 3)
      .map(f => `<span class="tag">${item.details[f.key]}</span>`)
      .join('');

    const price = item.details && item.details.price ? `<div class="listing-price">${item.details.price}</div>` : '';

    card.innerHTML = `
      ${imgUrl ? `<img class="listing-img" src="${imgUrl}" alt="${item.title}">` : `<div class="listing-img-placeholder">${CAT_ICON[cat]}</div>`}
      <div class="listing-body">
        <h3>${item.title}</h3>
        <div class="listing-meta">${tags}</div>
        ${price}
      </div>
    `;
    grid.appendChild(card);
  });

  area.innerHTML = '';
  area.appendChild(grid);
}
</script>
</body>
</html>
