<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>האזור האישי שלי — אתר הסת"ם המרכזי</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="categories.js"></script>
<script src="auth.js"></script>
</head>
<body>
<a href="#main" class="skip-link">דלג לתוכן העיקרי</a>

<div class="top-bar">
  ✡️ ברוכים הבאים לאתר הסת"ם המרכזי <span class="sep">•</span> פרסום מודעה בחינם <span class="sep">•</span> לוח אחד לכל עולם הסת"ם
</div>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="logo">
      <span class="logo-icon">🏛️</span>
      <span class="logo-text">אתר הסת"ם המרכזי</span>
    </a>
    <nav class="main-nav" aria-label="ניווט ראשי">
      <a href="index.html">דף הבית</a>
      <a href="forum-page.html" class="btn-forum">💬 פורום</a>
    </nav>
  </div>
</header>

<main id="main">
  <div class="container">
    <h1 class="page-title">האזור האישי שלי</h1>
    <p class="page-subtitle">המודעות שפרסמת באתר</p>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
      <button class="btn btn-gold" onclick="openPublishModal()">+ פרסם מודעה חדשה</button>
      <button class="btn btn-outline" onclick="doSignOut()">התנתק</button>
    </div>

    <div id="adsList">
      <div class="loading">טוען...</div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>אתר הסת"ם המרכזי &copy; <span id="year"></span></p>
  <p><a href="forum-page.html">פורום</a> | <a href="contact.html">צור קשר</a></p>
  <div class="legal-links">
    <button type="button" onclick="openLegalModal('privacy')">מדיניות פרטיות</button>
    |
    <button type="button" onclick="openLegalModal('terms')">תנאי שימוש</button>
    |
    <button type="button" onclick="openLegalModal('accessibility')">הצהרת נגישות</button>
  </div>
</footer>

<!-- מודאל בחירת קטגוריה לפרסום -->
<div class="modal-overlay" id="publishModal">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="publishModalTitle">
    <button class="modal-close" onclick="closePublishModal()" aria-label="סגור">✕</button>
    <h2 id="publishModalTitle">בחר קטגוריה לפרסום</h2>
    <div class="publish-cat-grid" id="publishCatGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="legalModal">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="legalModalTitle">
    <button class="modal-close" onclick="closeLegalModal()" aria-label="סגור">✕</button>
    <h2 id="legalModalTitle"></h2>
    <div id="legalModalBody"></div>
  </div>
</div>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

// בניית כרטיסי קטגוריה למודאל פרסום
const publishGrid = document.getElementById('publishCatGrid');
ALL_CATS.forEach(cat => {
  const a = document.createElement('a');
  a.href = 'form.html?cat=' + cat;
  a.innerHTML = `<span class="icon">${CAT_ICON[cat]}</span>${CAT_HE[cat]}`;
  publishGrid.appendChild(a);
});

function openPublishModal() { document.getElementById('publishModal').classList.add('open'); }
function closePublishModal() { document.getElementById('publishModal').classList.remove('open'); }
document.getElementById('publishModal').addEventListener('click', (e) => {
  if (e.target.id === 'publishModal') closePublishModal();
});

async function loadMyAds() {
  const user = await requireAuth('personal-area');
  if (!user) return;

  const area = document.getElementById('adsList');
  const { data, error } = await supabase
    .from('listings')
    .select('id, title, category, status, created_at, details, listing_images(storage_path, display_order)')
    .eq('user_id', user.id)
    .order('created_at', { ascending: false });

  if (error) {
    area.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>שגיאה בטעינת המודעות.</p></div>';
    return;
  }

  if (!data || !data.length) {
    area.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>עדיין לא פרסמת מודעות.</p></div>';
    return;
  }

  area.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'my-ads-grid';

  data.forEach(item => {
    const images = (item.listing_images || []).slice().sort((a,b) => a.display_order - b.display_order);
    const firstImg = images[0];
    const imgUrl = firstImg ? supabase.storage.from('listing-images').getPublicUrl(firstImg.storage_path).data.publicUrl : null;
    const isForum = item.category === 'forum';

    const card = document.createElement('div');
    card.className = 'my-ad-card';
    card.innerHTML = `
      ${imgUrl ? `<img class="my-ad-img" src="${imgUrl}" alt="${item.title}">` : `<div class="my-ad-img-placeholder">${CAT_ICON[item.category] || '📋'}</div>`}
      <div class="my-ad-body">
        <h3>${item.title}</h3>
        <div class="listing-meta"><span class="tag">${CAT_HE[item.category] || item.category}</span><span class="tag">${item.status === 'active' ? 'פעיל' : item.status}</span></div>
      </div>
      <div class="my-ad-actions">
        <a href="${isForum ? 'forum-page.html?id=' : 'listing.html?id='}${item.id}" class="btn btn-outline">צפייה</a>
        ${!isForum ? `<a href="form.html?cat=${item.category}&edit=${item.id}" class="btn btn-outline">עריכה</a>` : ''}
        <button class="btn btn-danger" onclick="deleteAd('${item.id}')">מחיקה</button>
      </div>
    `;
    grid.appendChild(card);
  });

  area.appendChild(grid);
}

async function doSignOut() {
  await signOut();
}

async function deleteAd(id) {
  if (!confirm('למחוק את המודעה?')) return;
  await supabase.from('listings').delete().eq('id', id);
  loadMyAds();
}

loadMyAds();

function openLegalModal(key) {
  const content = LEGAL_CONTENT[key];
  if (!content) return;
  document.getElementById('legalModalTitle').textContent = content.title;
  document.getElementById('legalModalBody').innerHTML = content.body;
  document.getElementById('legalModal').classList.add('open');
}
function closeLegalModal() {
  document.getElementById('legalModal').classList.remove('open');
}
document.getElementById('legalModal').addEventListener('click', (e) => {
  if (e.target.id === 'legalModal') closeLegalModal();
});
</script>
</body>
</html>
