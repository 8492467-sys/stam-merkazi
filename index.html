<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אתר הסת"ם המרכזי</title>
<meta name="description" content="לוח מודעות מרכזי לעולם הסת״ם – תפילין, מזוזות, ספרי תורה, מגילות, הגהות, יודאיקה, קורסים ועוד">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="categories.js"></script>
<script src="auth.js"></script>
</head>
<body>
<a href="#main" class="skip-link">דלג לתוכן העיקרי</a>

<div class="top-bar">
  ✡️ ברוכים הבאים לאתר הסת"ם המרכזי <span class="sep">•</span> פרסום מודעה בחינם <span class="sep">•</span> לוח אחד לכל עולם הסת"ם
</div>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="logo">
      <span class="logo-icon">🏛️</span>
      <span class="logo-text">אתר הסת"ם המרכזי</span>
    </a>
    <nav class="main-nav" aria-label="ניווט ראשי">
      <a href="forum-page.html" class="btn-forum">💬 פורום</a>
    </nav>
  </div>
</header>

<main id="main">
  <section class="hero">
    <div class="hero-badge"><span class="dot"></span><span>הלוח המרכזי לעולם הסת"ם</span></div>
    <h1>אתר הסת"ם המרכזי</h1>
    <div class="hero-pills">
      <span class="hero-pill"><span class="ico">🆓</span> פרסום חינם</span>
      <span class="hero-pill"><span class="ico">📍</span> הכל במקום אחד</span>
      <span class="hero-pill"><span class="ico">💬</span> פורום קהילתי</span>
    </div>
  </section>

  <div class="container">
    <h2 class="page-title">קטגוריות</h2>
    <span class="cat-count-badge" id="catCountBadge"></span>

    <div class="cats-layout">
      <div class="cat-grid" id="catGrid"></div>
      <div class="ad-sidebar" id="adSidebar"></div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>אתר הסת"ם המרכזי &copy; <span id="year"></span></p>
  <p><a href="forum-page.html">פורום</a> | <a href="contact.html">צור קשר</a></p>
  <div class="legal-links">
    <button type="button" onclick="openLegalModal('privacy')">מדיניות פרטיות</button>
    |
    <button type="button" onclick="openLegalModal('terms')">תנאי שימוש</button>
    |
    <button type="button" onclick="openLegalModal('accessibility')">הצהרת נגישות</button>
  </div>
</footer>

<!-- מודאל משפטי -->
<div class="modal-overlay" id="legalModal">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="legalModalTitle">
    <button class="modal-close" onclick="closeLegalModal()" aria-label="סגור">✕</button>
    <h2 id="legalModalTitle"></h2>
    <div id="legalModalBody"></div>
  </div>
</div>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

document.getElementById('catCountBadge').textContent = ALL_CATS.length + ' תחומים';

// בניית כרטיסי קטגוריה
const catGrid = document.getElementById('catGrid');
ALL_CATS.forEach(cat => {
  const colors = CAT_COLOR[cat];
  const card = document.createElement('a');
  card.className = 'cat-card';
  card.href = 'categories-all.html?cat=' + cat;
  card.style.borderTop = `4px solid ${colors.color}`;
  card.innerHTML = `
    <div class="cat-icon" style="background:${colors.bg};color:${colors.color};box-shadow:0 0 0 6px ${colors.shadow};">${CAT_ICON[cat]}</div>
    <h3>${CAT_HE[cat]}</h3>
    <p>${CAT_DESC[cat]}</p>
  `;
  catGrid.appendChild(card);
});

// קוביות פרסום פנויות — עמודה אנכית בצד התפריט
const adSidebar = document.getElementById('adSidebar');
for (let i = 0; i < 4; i++) {
  const a = document.createElement('a');
  a.className = 'side-ad-tile';
  a.href = 'contact.html';
  a.innerHTML = `
    <span class="ad-icon">📢</span>
    <span class="ad-title">פרסם כאן</span>
    <span class="ad-price">150 ₪ לחודש</span>
  `;
  adSidebar.appendChild(a);
}

// מודאל משפטי
function openLegalModal(key) {
  const content = LEGAL_CONTENT[key];
  if (!content) return;
  document.getElementById('legalModalTitle').textContent = content.title;
  document.getElementById('legalModalBody').innerHTML = content.body;
  document.getElementById('legalModal').classList.add('open');
}
function closeLegalModal() {
  document.getElementById('legalModal').classList.remove('open');
}
document.getElementById('legalModal').addEventListener('click', (e) => {
  if (e.target.id === 'legalModal') closeLegalModal();
});
</script>
</body>
</html>
