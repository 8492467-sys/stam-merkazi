<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מתחבר...</title>
<style>
body { font-family: 'Rubik', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #0b1d3a; color: #f0f4fb; }
.box { text-align: center; padding: 32px; }
.spinner { width: 40px; height: 40px; border: 3px solid #1a3a6e; border-top-color: #c8902a; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
</head>
<body>
<div class="box">
  <div class="spinner" role="status" aria-hidden="true"></div>
  <p id="msg" aria-live="polite" aria-atomic="true">מתחבר עם Google...</p>
</div>
<script>
(async function() {
  const msg = document.getElementById('msg');
  try {
    const session = await waitForAuthSession(15000);
    if (!session?.user) {
      msg.textContent = 'ההתחברות נכשלה. מעביר לדף הבית...';
      sessionStorage.removeItem('authInProgress');
      setTimeout(() => { window.location.href = 'index.html'; }, 2000);
      return;
    }
    persistUserFromSession(session.user);
    sessionStorage.removeItem('authInProgress');
    if (location.hash) {
      history.replaceState(null, '', location.pathname);
    }
    finishAuthRedirect();
  } catch (e) {
    console.error(e);
    msg.textContent = 'שגיאה בהתחברות. מעביר לדף הבית...';
    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
  }
})();
</script>
</body>
</html>
