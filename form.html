<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פרסום מודעה — אתר הסת"ם המרכזי</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="categories.js"></script>
<script src="upload-images.js"></script>
<script src="auth.js"></script>
</head>
<body>
<a href="#main" class="skip-link">דלג לתוכן העיקרי</a>

<div class="top-bar">
  ✡️ ברוכים הבאים לאתר הסת"ם המרכזי <span class="sep">•</span> פרסום מודעה בחינם <span class="sep">•</span> לוח אחד לכל עולם הסת"ם
</div>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="logo">
      <span class="logo-icon">🏛️</span>
      <span class="logo-text">אתר הסת"ם המרכזי</span>
    </a>
    <nav class="main-nav" aria-label="ניווט ראשי">
      <a href="my-ads.html">האזור האישי שלי</a>
      <a href="forum-page.html" class="btn-forum">💬 פורום</a>
    </nav>
  </div>
</header>

<main id="main">
  <div class="container">
    <h1 class="page-title" id="formTitle">פרסום מודעה</h1>
    <p class="page-subtitle" id="formSubtitle"></p>

    <div class="form-card">
      <div id="formAlert"></div>

      <div class="form-group">
        <label for="title">כותרת המודעה *</label>
        <input type="text" id="title" placeholder="לדוגמה: זוג תפילין רש״י מהודרות">
      </div>

      <div class="form-group">
        <label for="description">תיאור</label>
        <textarea id="description" maxlength="600" oninput="document.getElementById('descCount').textContent = this.value.length + ' / 600'"></textarea>
        <div class="char-counter" id="descCount">0 / 600</div>
      </div>

      <div id="categoryFields"></div>

      <div class="form-group">
        <label for="phone">טלפון *</label>
        <input type="tel" id="phone" placeholder="050-0000000">
      </div>

      <div class="form-group">
        <div class="checkbox-row">
          <input type="checkbox" id="hasWebsite" onchange="document.getElementById('websiteWrap').style.display = this.checked ? 'block' : 'none'">
          <label for="hasWebsite" style="margin:0;">יש לי אתר / קישור</label>
        </div>
        <div id="websiteWrap" style="display:none;margin-top:8px;">
          <input type="url" id="website" placeholder="https://www.example.com">
        </div>
      </div>

      <div class="form-group">
        <label>תמונות וקבצים (עד 5 תמונות, עד 3 קבצי PDF)</label>
        <div class="hint" style="margin-bottom:8px;">📸 העלאת תמונות משדרגת את המודעה ומושכת קהל רב יותר</div>
        <div class="image-upload-grid" id="uploadGrid">
          <div class="image-upload-slot" onclick="document.getElementById('imgInput').click()">
            <span class="placeholder">📷</span>
          </div>
        </div>
        <input type="file" id="imgInput" accept="image/*,application/pdf" multiple style="display:none">
      </div>

      <button class="btn btn-submit btn-block" id="submitBtn" onclick="submitForm()">פרסם מודעה</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p>אתר הסת"ם המרכזי &copy; <span id="year"></span></p>
  <p><a href="forum-page.html">פורום</a> | <a href="contact.html">צור קשר</a></p>
  <div class="legal-links">
    <button type="button" onclick="openLegalModal('privacy')">מדיניות פרטיות</button>
    |
    <button type="button" onclick="openLegalModal('terms')">תנאי שימוש</button>
    |
    <button type="button" onclick="openLegalModal('accessibility')">הצהרת נגישות</button>
  </div>
</footer>

<div class="modal-overlay" id="legalModal">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="legalModalTitle">
    <button class="modal-close" onclick="closeLegalModal()" aria-label="סגור">✕</button>
    <h2 id="legalModalTitle"></h2>
    <div id="legalModalBody"></div>
  </div>
</div>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const params = new URLSearchParams(location.search);
const cat = params.get('cat');
const editId = params.get('edit');

let imgCount = 0;
let pdfCount = 0;
const MAX_IMAGES = 5;
const MAX_PDFS = 3;
let existingImages = [];
let imagesToDelete = [];

if (!cat || !ALL_CATS.includes(cat)) {
  document.querySelector('.form-card').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>קטגוריה לא נמצאה. <a href="index.html">חזרה לדף הבית</a></p></div>';
} else {
  document.getElementById('formTitle').textContent = (editId ? 'עריכת מודעה — ' : 'פרסום מודעה — ') + CAT_HE[cat];
  document.getElementById('formSubtitle').textContent = CAT_DESC[cat];
  document.title = (editId ? 'עריכת מודעה — ' : 'פרסום מודעה — ') + CAT_HE[cat] + ' — אתר הסת"ם המרכזי';
  buildCategoryFields();
  if (editId) loadForEdit();
}

function buildCategoryFields() {
  const wrap = document.getElementById('categoryFields');
  const fields = CATEGORY_FIELDS[cat] || [];
  fields.forEach(field => {
    const group = document.createElement('div');
    group.className = 'form-group';

    if (field.type === 'checkbox') {
      group.innerHTML = `
        <div class="checkbox-row">
          <input type="checkbox" id="field-${field.key}">
          <label for="field-${field.key}" style="margin:0;">${field.label}${field.required ? ' *' : ''}</label>
        </div>
      `;
      wrap.appendChild(group);
      return;
    }

    if (field.type === 'checkboxes') {
      const groupLabel = document.createElement('label');
      groupLabel.textContent = field.label + (field.required ? ' *' : '');
      group.appendChild(groupLabel);
      field.options.forEach((opt, i) => {
        const row = document.createElement('div');
        row.className = 'checkbox-row';
        row.innerHTML = `<input type="checkbox" id="field-${field.key}-${i}"><label for="field-${field.key}-${i}" style="margin:0;">${opt}</label>`;
        group.appendChild(row);
      });
      wrap.appendChild(group);
      return;
    }

    const label = document.createElement('label');
    label.textContent = field.label + (field.required ? ' *' : '');
    label.setAttribute('for', 'field-' + field.key);
    group.appendChild(label);

    if (field.type === 'select') {
      const select = document.createElement('select');
      select.id = 'field-' + field.key;
      let options = field.options.slice();
      if (field.allowOther && !options.includes('אחר')) options.push('אחר');
      select.innerHTML = '<option value="">בחר...</option>' + options.map(o => `<option value="${o}">${o}</option>`).join('');
      group.appendChild(select);

      if (field.allowOther) {
        const otherInput = document.createElement('input');
        otherInput.type = field.otherType === 'number' ? 'number' : 'text';
        otherInput.id = 'field-' + field.key + '-other';
        otherInput.placeholder = 'הזן ערך';
        otherInput.style.marginTop = '8px';
        otherInput.style.display = 'none';
        select.addEventListener('change', () => {
          otherInput.style.display = select.value === 'אחר' ? 'block' : 'none';
        });
        group.appendChild(otherInput);
      }
    } else {
      const input = document.createElement('input');
      input.type = field.type === 'number' ? 'number' : 'text';
      input.id = 'field-' + field.key;
      if (field.placeholder) input.placeholder = field.placeholder;
      group.appendChild(input);
    }
    wrap.appendChild(group);
  });
}

// ------------------------------------------------------------
// Image handling
// ------------------------------------------------------------
document.getElementById('imgInput').addEventListener('change', function() {
  if (!validateImageFiles(this.files)) { this.value = ''; return; }
  Array.from(this.files).forEach(file => {
    const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
    if (isPdf) {
      if (pdfCount >= MAX_PDFS) return;
      pdfCount++;
    } else {
      if (imgCount >= MAX_IMAGES) return;
      imgCount++;
    }
    selectedFiles.push(file);
    const slot = document.createElement('div');
    slot.className = 'image-upload-slot';
    const grid = document.getElementById('uploadGrid');
    const addSlot = grid.querySelector('.image-upload-slot:last-child');
    if (isPdf) {
      slot.innerHTML = `<span class="placeholder">📄</span>`;
      grid.insertBefore(slot, addSlot);
    } else {
      const reader = new FileReader();
      reader.onload = e => { slot.innerHTML = `<img src="${e.target.result}" alt="">`; };
      reader.readAsDataURL(file);
      grid.insertBefore(slot, addSlot);
    }
    if (imgCount >= MAX_IMAGES && pdfCount >= MAX_PDFS) addSlot.style.display = 'none';
  });
  this.value = '';
});

// ------------------------------------------------------------
// Edit mode — load existing listing
// ------------------------------------------------------------
async function loadForEdit() {
  const { data, error } = await supabase.from('listings').select('*, listing_images(*)').eq('id', editId).single();
  if (error || !data) return;

  document.getElementById('title').value = data.title || '';
  document.getElementById('description').value = data.description || '';
  document.getElementById('descCount').textContent = (data.description || '').length + ' / 600';
  document.getElementById('phone').value = data.phone || '';
  if (data.website) {
    document.getElementById('hasWebsite').checked = true;
    document.getElementById('websiteWrap').style.display = 'block';
    document.getElementById('website').value = data.website;
  }

  const d = data.details || {};
  (CATEGORY_FIELDS[cat] || []).forEach(field => {
    if (field.type === 'checkboxes') {
      const arr = Array.isArray(d[field.key]) ? d[field.key] : [];
      field.options.forEach((opt, i) => {
        const cb = document.getElementById('field-' + field.key + '-' + i);
        if (cb) cb.checked = arr.includes(opt);
      });
      return;
    }
    const el = document.getElementById('field-' + field.key);
    if (!el || d[field.key] == null) return;
    if (field.type === 'checkbox') {
      el.checked = !!d[field.key];
    } else if (field.type === 'select' && field.allowOther && !field.options.includes(String(d[field.key]))) {
      el.value = 'אחר';
      const otherInput = document.getElementById('field-' + field.key + '-other');
      if (otherInput) { otherInput.style.display = 'block'; otherInput.value = d[field.key]; }
    } else {
      el.value = d[field.key];
    }
  });

  existingImages = (data.listing_images || []).slice().sort((a,b) => a.display_order - b.display_order);
  renderExistingImages();

  document.getElementById('submitBtn').textContent = 'שמור שינויים';
}

// ------------------------------------------------------------
// Existing images (edit mode)
// ------------------------------------------------------------
function renderExistingImages() {
  const grid = document.getElementById('uploadGrid');
  const addSlot = grid.querySelector('.image-upload-slot:last-child');

  existingImages.forEach(img => {
    const isPdf = img.storage_path.toLowerCase().endsWith('.pdf');
    if (isPdf) pdfCount++; else imgCount++;

    const slot = document.createElement('div');
    slot.className = 'image-upload-slot';
    if (isPdf) {
      slot.innerHTML = `<span class="placeholder">📄</span>`;
    } else {
      const url = supabase.storage.from('listing-images').getPublicUrl(img.storage_path).data.publicUrl;
      slot.innerHTML = `<img src="${url}" alt="">`;
    }
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'remove-btn';
    removeBtn.innerHTML = '✕';
    removeBtn.onclick = (e) => { e.stopPropagation(); removeExistingImage(img.id, slot); };
    slot.appendChild(removeBtn);
    grid.insertBefore(slot, addSlot);
  });

  if (imgCount >= MAX_IMAGES && pdfCount >= MAX_PDFS) addSlot.style.display = 'none';
}

function removeExistingImage(imgId, slotEl) {
  const idx = existingImages.findIndex(img => img.id === imgId);
  if (idx === -1) return;
  const img = existingImages[idx];
  const isPdf = img.storage_path.toLowerCase().endsWith('.pdf');
  if (isPdf) pdfCount--; else imgCount--;
  imagesToDelete.push({ id: img.id, storage_path: img.storage_path });
  existingImages.splice(idx, 1);
  slotEl.remove();

  const grid = document.getElementById('uploadGrid');
  const addSlot = grid.querySelector('.image-upload-slot:last-child');
  if (imgCount < MAX_IMAGES || pdfCount < MAX_PDFS) addSlot.style.display = 'flex';
}

// ------------------------------------------------------------
// Submit
// ------------------------------------------------------------
function showAlert(msg, type) {
  document.getElementById('formAlert').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}

async function submitForm() {
  const title = document.getElementById('title').value.trim();
  const phone = document.getElementById('phone').value.trim();

  if (!title || !phone) {
    showAlert('נא למלא כותרת וטלפון', 'error');
    return;
  }

  const requiredFields = (CATEGORY_FIELDS[cat] || []).filter(f => f.required);
  for (const field of requiredFields) {
    const el = document.getElementById('field-' + field.key);
    if (!el || !String(el.value).trim()) {
      showAlert('נא למלא את השדה: ' + field.label, 'error');
      return;
    }
  }

  const authUser = await requireAuth('form:form.html?cat=' + cat + (editId ? '&edit=' + editId : ''));
  if (!authUser) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'שומר...';

  try {
    const details = {};
    (CATEGORY_FIELDS[cat] || []).forEach(field => {
      if (field.type === 'checkboxes') {
        const checked = field.options.filter((opt, i) => {
          const cb = document.getElementById('field-' + field.key + '-' + i);
          return cb && cb.checked;
        });
        if (checked.length) details[field.key] = checked;
        return;
      }
      const el = document.getElementById('field-' + field.key);
      if (!el) return;
      if (field.type === 'checkbox') {
        if (el.checked) details[field.key] = true;
      } else if (field.type === 'select' && field.allowOther && el.value === 'אחר') {
        const otherInput = document.getElementById('field-' + field.key + '-other');
        if (otherInput && otherInput.value.trim()) details[field.key] = otherInput.value.trim();
      } else if (String(el.value).trim()) {
        details[field.key] = el.value.trim();
      }
    });

    const payload = {
      category: cat,
      title,
      description: document.getElementById('description').value.trim(),
      phone,
      details,
      user_id: authUser.id
    };

    let listingId = editId;
    if (editId) {
      const { error } = await supabase.from('listings').update(payload).eq('id', editId);
      if (error) throw error;
    } else {
      const { data: listing, error } = await supabase.from('listings').insert(payload).select('id').single();
      if (error) throw error;
      listingId = listing.id;
    }

    await saveListingWebsite(listingId);

    for (const img of imagesToDelete) {
      await supabase.storage.from('listing-images').remove([img.storage_path]);
      await supabase.from('listing_images').delete().eq('id', img.id);
    }

    await uploadListingImages(listingId, existingImages.length);

    window.location.href = 'my-ads.html';
  } catch (err) {
    showAlert('שגיאה: ' + (err.message || JSON.stringify(err)), 'error');
    btn.disabled = false;
    btn.textContent = editId ? 'שמור שינויים' : 'פרסם מודעה';
  }
}

function openLegalModal(key) {
  const content = LEGAL_CONTENT[key];
  if (!content) return;
  document.getElementById('legalModalTitle').textContent = content.title;
  document.getElementById('legalModalBody').innerHTML = content.body;
  document.getElementById('legalModal').classList.add('open');
}
function closeLegalModal() {
  document.getElementById('legalModal').classList.remove('open');
}
document.getElementById('legalModal').addEventListener('click', (e) => {
  if (e.target.id === 'legalModal') closeLegalModal();
});
</script>
</body>
</html>
